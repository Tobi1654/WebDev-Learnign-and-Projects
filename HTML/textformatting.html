<!DOCTYPE html>
<html>  
<head>
    <title>Text Formatting</title>
</head>
<body>
    <p>This is a normal text</p> <!-- normal text -->
    <p>This is a <b>bold</b> text</p> <!-- bold text -->
    <p>This is a <i>Italic</i> text</p> <!-- italic text -->
    <p>This is a <u>underlined</u> text</p> <!-- underlined text -->
    <p>This is a <del>deleted</del>> text</p> <!-- deleted text -->
    <p>This is a <big>big</big> text</p> <!-- big text -->
    <p>This is a <small>small</small> text</p>  <!-- small text -->
    <p>This is a <sub>subscript</sub> text</p> <!-- subscript text -->
    <p>This is a <sup>superscript</sup> text</p> <!-- superscript text -->
    <p>This is a <mark style="background-color: aqua;">highlighted</mark> text</p> <!-- marked/highlighted text -->
        <!--INLINE CSS-->
        <!-- you can change the color of the highlight by changing the background-color value -->
</body>
</html>
