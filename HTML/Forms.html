<!DOCTYPE html>
<html>
<head>
    <title>FORMS</title>
</head>


<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">
    <!--ACTION: Sends files to attribute in this case 'index.php'-->
    <!--METHOD: Specifies if GET or POST request-->
    <!--POST: Used for confidential info-->
    <!--GET: Insensitive data-->
    <!--ENCTYPE: Allows multiple files and rearranges them-->

        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Sigma443" minlength="5" maxlength="15" required>
        <!--INPUT: Inputs a form type-->
        <!--PLACEHOLDER: Shows what the user's input should look like-->
        <!--REQUIRED: Form is required-->
        <!--MINLENGTH: Minimum amount of characters-->
        <!--MAXLENGTH: Maximin amount of characters-->
        <!--ID: Link to your for attribute-->
        <br>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" minlength="8" required>
        <!--PASSWORD: Hides the input-->
        
        <br>
        <br>


        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="JDoe@gmail.com" required>
        <!--EMAIL: Checks if input is in email format-->

        <br>
        <br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="07112344565" pattern="[0-11]" required>
        <!--TEL: Checks if input is in phone number format-->

        <br>
        <br>

        <label for="birthday">Birthday</label>
        <input type="date" id="birthday"> 
        <!--DATE: Inputs a date-->

        <br>
        <br>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="0" max="99" value="1">
        <!--NUMBER: Inputs a number-->
        <!--MIN: Minimum number-->
        <!--MAX: Maximum number-->

        <br>
        <br>

        <label for="tiitle">Title:</label>
        
        <label for="Mr">Mr</label>
        <input type="radio" id="Mr" name="title" value="Mr">
        <label for="Mrs">Mrs</label>
        <input type="radio" id="Mrs" name="title" value="Mrs">
        <label for="Dr">Dr</label>
        <input type="radio" id="Dr" name="title" value="Dr">
        <!--RADIO: Only one option can be selected-->

        <br>
        <br>

        <label for="payment">Payment:</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="paypal">Paypal</option>
        </select>
        <!--SELECT: Dropdown menu-->
        <!--OPTION: Options in dropdown menu-->

        <br>
        <br>

        <label for="subscibe">Subscribe:</label>
        <input type="checkbox" id="subscribe">
        <!--CHECKBOX: Multiple options can be selected-->

        <br>
        <br>

        <label for="comments">Comments:</label>
        <textarea id="comments" rows="3" cols="25"></textarea>
        <!--TEXTAREA: Multi-line text input-->

        <br>
        <br>

        <label for="file">File:</label>
        <input type="file" if="file" accept="image/png, image/jpeg">
        <!--FILE: Uploads a file-->
        <!--ACCEPT: Specifies the types of files that the server accepts-->


        <br>

        <input type="submit"><br>
        <input type="reset">
        <!--Input type is a button-->

    </form>
</body>
</html>
