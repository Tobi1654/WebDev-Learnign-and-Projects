<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="apply.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form class="main">
            <label for="full-name">Full Name: </label>
            <input required id="full-name" name="full-name" type="text" placeholder="John Doe">

            <label for="email">Email: </label>
            <input id="email" name="email" type="email" placeholder="example@gmail.com" required>

            <label for="position" >Position: </label>
            <select id="position" name="position" required>
                <option value="manager">Manager</option>
                <option value="crew">Crew Member</option>
                <option value="FOH">Front Of House</option>
                <option value="health">Cleaner</option>
                <option value="safety">Security</option>
            </select>

            <fieldset class="radio-group">
    <legend>Availability</legend>

    <input class="applied-position-radio-btn" id="full-time" name="availability" type="radio" value="full-time" checked>
    <label class="applied-position" for="full-time">Full-Time</label>

    <input class="applied-position-radio-btn" type="radio" id="part-time" name="availability" value="part-time">
    <label class="applied-position" for="part-time">Part-Time</label>

    <input class="applied-position-radio-btn" type="radio" id="intern" name="availability" value="intern">
    <label class="applied-position" for="intern">Intern</label>
</fieldset>

            <label for="message">Why do you want this job:</label>
            <textarea id="message" name="notes" rows="4" cols="50"></textarea>

            <button type="submit" class="submit-btn">Submit Form</button>

        </form>
    </div>

    
</body>
</html>
